<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalonPro — Tizimga Kirish</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0a0a0f;--card:#13131a;--border:#1e1e2e;
      --purple:#8B5CF6;--pink:#EC4899;--blue:#3B82F6;
      --text:#f1f5f9;--muted:#64748b;--error:#F43F5E;
    }
    body{
      font-family:'Inter',sans-serif;background:var(--bg);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background-image:radial-gradient(ellipse at 20% 50%,rgba(139,92,246,0.08) 0%,transparent 60%),
                       radial-gradient(ellipse at 80% 20%,rgba(236,72,153,0.06) 0%,transparent 60%);
    }
    .login-wrap{width:100%;max-width:420px;padding:24px}
    .logo{text-align:center;margin-bottom:40px}
    .logo-icon{
      width:72px;height:72px;border-radius:20px;margin:0 auto 16px;
      background:linear-gradient(135deg,var(--purple),var(--pink));
      display:flex;align-items:center;justify-content:center;font-size:32px;
      box-shadow:0 0 40px rgba(139,92,246,0.4);
    }
    .logo h1{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
    .logo p{color:var(--muted);font-size:14px;margin-top:4px}
    .card{
      background:var(--card);border:1px solid var(--border);border-radius:20px;
      padding:32px;box-shadow:0 24px 64px rgba(0,0,0,0.4);
    }
    .card h2{font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px}
    .card p{color:var(--muted);font-size:13px;margin-bottom:28px}
    .form-group{margin-bottom:18px}
    label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
    .input-wrap{position:relative}
    .input-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
    input{
      width:100%;padding:13px 14px 13px 42px;background:rgba(255,255,255,0.04);
      border:1px solid var(--border);border-radius:12px;color:var(--text);
      font-family:'Inter',sans-serif;font-size:14px;outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,0.15)}
    input::placeholder{color:var(--muted)}
    .btn{
      width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;
      font-family:'Inter',sans-serif;font-size:15px;font-weight:600;
      background:linear-gradient(135deg,var(--purple),var(--pink));
      color:#fff;margin-top:8px;
      transition:opacity .2s,transform .1s,box-shadow .2s;
      box-shadow:0 4px 24px rgba(139,92,246,0.35);
    }
    .btn:hover{opacity:.9;box-shadow:0 8px 32px rgba(139,92,246,0.5)}
    .btn:active{transform:scale(0.99)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .error-msg{
      background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.3);
      color:var(--error);padding:12px 16px;border-radius:10px;font-size:13px;
      margin-top:16px;display:none;text-align:center;
    }
    .roles-info{margin-top:28px;border-top:1px solid var(--border);padding-top:20px}
    .roles-info p{font-size:11px;color:var(--muted);margin-bottom:12px;text-align:center;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
    .role-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .pill{
      padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;
      border:1px solid;transition:all .2s;
    }
    .pill.purple{color:var(--purple);border-color:rgba(139,92,246,0.4);background:rgba(139,92,246,0.08)}
    .pill.blue{color:var(--blue);border-color:rgba(59,130,246,0.4);background:rgba(59,130,246,0.08)}
    .pill.pink{color:var(--pink);border-color:rgba(236,72,153,0.4);background:rgba(236,72,153,0.08)}
    .pill.green{color:#10B981;border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.08)}
    .pill:hover{transform:scale(1.05)}
    .loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:480px){.login-wrap{padding:16px}.card{padding:24px}}
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-icon">💈</div>
    <h1>SalonPro</h1>
    <p>Professional Salon Boshqaruv Tizimi</p>
  </div>

  <div class="card">
    <h2>Xush kelibsiz 👋</h2>
    <p>Tizimga kirish uchun login va parolingizni kiriting</p>

    <div class="form-group">
      <label>Login</label>
      <div class="input-wrap">
        <span>👤</span>
        <input type="text" id="username" placeholder="loginni kiriting" autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label>Parol</label>
      <div class="input-wrap">
        <span>🔑</span>
        <input type="password" id="password" placeholder="parolni kiriting" autocomplete="current-password">
      </div>
    </div>

    <button class="btn" id="loginBtn" onclick="doLogin()">Kirish →</button>
    <div class="error-msg" id="errorMsg"></div>

    <div class="roles-info">
      <p>Demo Akkauntlar</p>
      <div class="role-pills">
        <span class="pill purple" onclick="fillLogin('superadmin','admin123')" title="superadmin / admin123">🔱 SuperAdmin</span>
        <span class="pill blue"   onclick="fillLogin('admin','salon123')"       title="admin / salon123">⚙ Admin</span>
        <span class="pill pink"   onclick="fillLogin('reception','rec123')"     title="reception / rec123">📋 Reception</span>
        <span class="pill green"  onclick="fillLogin('master','master123')"     title="master / master123">💈 Master</span>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';

function fillLogin(u, p){
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
  document.getElementById('errorMsg').style.display = 'none';
}

document.getElementById('password').addEventListener('keydown', e => {
  if(e.key === 'Enter') doLogin();
});
document.getElementById('username').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('password').focus();
});

async function doLogin(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const errEl    = document.getElementById('errorMsg');

  if(!username || !password){
    showError('Login va parolni kiriting!'); return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>Tekshirilmoqda...';
  errEl.style.display = 'none';

  try {
    const form = new FormData();
    form.append('username', username);
    form.append('password', password);

    const res  = await fetch(`${API}/api/auth/login`, { method:'POST', body:form });
    const data = await res.json();

    if(!res.ok){
      showError(data.detail || 'Login yoki parol noto\'g\'ri');
      return;
    }

    // Token saqlash
    localStorage.setItem('token',     data.access_token);
    localStorage.setItem('role',      data.role);
    localStorage.setItem('salon_id',  data.salon_id || '');
    localStorage.setItem('staff_id',  data.staff_id || '');
    localStorage.setItem('full_name', data.full_name || '');

    btn.innerHTML = '✅ Kirish muvaffaqiyatli!';

    setTimeout(() => {
      window.location.href = data.redirect || '/';
    }, 500);

  } catch(e) {
    showError('Server bilan bog\'lanib bo\'lmadi. Server ishlaydimi?');
  } finally {
    if(btn.disabled){
      btn.disabled = false;
      if(!btn.innerHTML.includes('✅'))
        btn.innerHTML = 'Kirish →';
    }
  }
}

function showError(msg){
  const el = document.getElementById('errorMsg');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
  const btn = document.getElementById('loginBtn');
  btn.disabled = false;
  btn.innerHTML = 'Kirish →';
}

// Allaqachon login qilingan bo'lsa redirect
const token = localStorage.getItem('token');
if(token){
  const role = localStorage.getItem('role');
  const redirects = {superadmin:'/superadmin/',admin:'/',reception:'/reception/',master:'/ustalar/'};
  const dest = redirects[role] || '/';
  // Token hali ham yaroqli ekanligini tekshirish
  fetch(`${API}/api/auth/me`, {headers:{'Authorization':'Bearer '+token}})
    .then(r => { if(r.ok) window.location.href = dest; })
    .catch(() => {});
}
</script>
</body>
</html>
