<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Chronix">
  <!-- Chronix belgisi: ko'k "C" halqa + ichida soat (10:10) to'q ko'k doirada. O'lchamlar mobile/src/AnimatedSplash.tsx
       dagi MARK/CLOCK/TICK/HAND qiymatlaridan. Vektor: istalgan o'lchamda va istalgan fonda tiniq. -->
  <defs>
    <linearGradient id="cx-ring" x1="14" y1="90" x2="88" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1235f2"/>
      <stop offset="0.55" stop-color="#1f6bff"/>
      <stop offset="1" stop-color="#2bd2ff"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="52" r="24.5" fill="#0a1650"/>
  <path d="M76 31.7 A33 33 0 1 0 76 72.3" fill="none" stroke="url(#cx-ring)" stroke-width="18" stroke-linecap="round"/>
  <g fill="#fff" transform="translate(50 52)">
    <rect x="-1.1" y="-20" width="2.2" height="5" rx="1.1" opacity="0.92"/>
    <rect x="-1.1" y="15" width="2.2" height="5" rx="1.1" opacity="0.92"/>
    <rect x="-20" y="-1.1" width="5" height="2.2" rx="1.1" opacity="0.92"/>
    <rect x="15" y="-1.1" width="5" height="2.2" rx="1.1" opacity="0.92"/>
    <rect x="-1.2" y="-12" width="2.4" height="12" rx="1.2" transform="rotate(-50)"/>
    <rect x="-1.2" y="-17.5" width="2.4" height="17.5" rx="1.2" transform="rotate(55)"/>
    <circle r="2.7"/>
  </g>
</svg>
